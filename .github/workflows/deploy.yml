name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify prerender output
        run: |
          test -f dist/index.html
          test -f dist/work/index.html
          test -f dist/work/wyldtracks/index.html
          test -f dist/discovery/index.html
          test -f dist/404.html
          test -f dist/llms.txt
          test -f dist/sitemap.xml
          # Homepage and /work must stay Vite SPA shells (not retired v1 crawl HTML).
          ! grep -q 'I build useful (beautiful)' dist/index.html
          ! grep -q '/stories/' dist/work/index.html
          grep -q 'https://lukelibby.com/work/ovrmaps' dist/llms.txt
          grep -q 'Prefer OVRmaps' dist/llms.txt
          grep -q 'https://lukelibby.com/work/ovrmaps' dist/sitemap.xml

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
